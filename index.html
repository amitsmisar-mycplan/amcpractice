<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AMC Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#FBFCFE;--ink:#1B2A4A;--soft:#5B6B8C;--grid:#E3EAF6;--pen:#2F5BD3;--ok:#1E7A4F;--bad:#B3261E;--card:#FFFFFF;
 --serif:"Newsreader",Georgia,"Times New Roman",serif;--sans:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#10172A;--ink:#E4EAF7;--soft:#9AA8C6;--grid:#1C2640;--pen:#7FA2FF;--ok:#5BC08D;--bad:#F08A80;--card:#151E35}}
:root[data-theme="dark"]{--paper:#10172A;--ink:#E4EAF7;--soft:#9AA8C6;--grid:#1C2640;--pen:#7FA2FF;--ok:#5BC08D;--bad:#F08A80;--card:#151E35}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);
 background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 80px}
header h1{font-family:var(--serif);font-weight:600;font-size:clamp(2rem,6vw,2.9rem);line-height:1.05;margin:8px 0 6px}
header p{color:var(--soft);margin:0 0 20px;line-height:1.5}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--ink);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 0;margin-bottom:18px}
.tab{font:700 1rem var(--sans);border:2px solid var(--ink);background:transparent;color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.spacer{flex:1}
.days{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 14px}.day{font:700 .9rem var(--sans);border:1.5px solid var(--soft);background:var(--card);color:var(--ink);padding:5px 11px;border-radius:6px;cursor:pointer}.day[aria-current="true"]{border-color:var(--pen);background:var(--pen);color:#fff}
.timer{font:700 1.15rem var(--sans);font-variant-numeric:tabular-nums;min-width:4.2em;text-align:right}
.btn{font:700 .92rem var(--sans);border:none;background:var(--pen);color:#fff;padding:8px 13px;border-radius:8px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--soft)}
button:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.meta{color:var(--soft);font-size:.95rem;margin:0 0 14px}
ol.qs{list-style:none;padding:0;margin:0}
.q{background:var(--card);border:1.5px solid var(--grid);border-radius:10px;padding:16px 16px 14px;margin-bottom:12px;display:grid;grid-template-columns:2.2rem 1fr;gap:4px 10px}
.num{font:600 1.35rem var(--serif);color:var(--pen)}
.stem{font:400 1.12rem/1.6 var(--serif)}
.choices{grid-column:2;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px 12px;margin-top:10px}
.ch{display:flex;align-items:center;gap:9px;background:none;border:none;color:var(--ink);font:400 1.05rem var(--serif);cursor:pointer;padding:4px 2px;text-align:left}
.bub{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font:700 .8rem var(--sans);transition:background .12s}
.ch[aria-pressed="true"] .bub{background:var(--ink);color:var(--paper)}
.q.ok{border-color:var(--ok)} .q.bad{border-color:var(--bad)}
.ch.right .bub{border-color:var(--ok);background:var(--ok);color:#fff}
.ch.wrong .bub{border-color:var(--bad);background:var(--bad);color:#fff}
.verdict{grid-column:2;font-size:.9rem;margin-top:8px;font-weight:700}
.q.ok .verdict{color:var(--ok)} .q.bad .verdict,.q.blank .verdict{color:var(--bad)}
.q.blank .verdict{color:var(--soft)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.85em;line-height:1.05;margin:0 2px}
.fr sup,.fr sub{font-size:1em;vertical-align:baseline;position:static}
.fr sup{border-bottom:1.3px solid currentColor;padding:0 2px}
.fr>span{display:none}
.score{border:2px solid var(--ink);border-radius:12px;padding:18px;margin:22px 0;background:var(--card);display:none}
.score strong{font:600 2.4rem var(--serif);display:block}
.foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
@media print{body{background:#fff;color:#000}.bar,.foot,.score,.verdict{display:none!important}.q{break-inside:avoid;border:none;padding:6px 0}.panel[hidden]{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="wrap">
<header>
<h1 id="hd">AMC practice</h1><div class="days" id="days"></div>
<p>Two original practice tests in the AMC format: 25 questions, 75 minutes. Scoring follows the real contest: 6 points for a correct answer, 1.5 for a blank, 0 for a wrong one. Answers save on this device as you go. Printable PDF copies come with each day in the chat.</p>
</header>
<div class="bar" role="tablist">
<button class="tab" role="tab" data-t="amc10" aria-selected="true">AMC 10</button>
<button class="tab" role="tab" data-t="amc12" aria-selected="false">AMC 12</button>
<span class="spacer"></span>
<span class="timer" id="clock">75:00</span>
<button class="btn" id="go">Start timer</button>
</div>
<main id="main"></main>
</div>
<script>
const DAYS={"1": {"amc10": [{"q": "Compute (4<sup>2</sup> &minus; 2<sup>4</sup> + 3<sup>3</sup>) &divide; 3.", "c": ["27", "12", "6", "3", "9"], "a": "E"}, {"q": "A shirt priced at $40 is marked 25% off. At the register, an extra 10% is taken off the sale price. What is the final price?", "c": ["$26", "$25", "$28", "$24", "$27"], "a": "E"}, {"q": "The average of five numbers is 12. After one number is removed, the average of the remaining four is 10. What number was removed?", "c": ["16", "14", "22", "20", "18"], "a": "D"}, {"q": "How many positive integers less than 100 are multiples of 3 or of 5, but not of both?", "c": ["40", "42", "34", "38", "46"], "a": "A"}, {"q": "A rectangle has perimeter 34 and a diagonal of length 13. What is its area?", "c": ["72", "60", "56", "50", "64"], "a": "B"}, {"q": "Maria travels 6 miles to school. She walks at 4 mph for exactly half of the total travel <em>time</em> and runs at 8 mph for the other half. How many minutes does the trip take?", "c": ["45", "60", "67.5", "50", "54"], "a": "B"}, {"q": "What is the sum of the digits of 10<sup>20</sup> &minus; 20?", "c": ["180", "162", "170", "168", "172"], "a": "C"}, {"q": "A line passes through (1, 2) and (4, 11). At what x-value does it cross the x-axis?", "c": ["1", "<span class=\"fr\"><sup>1</sup><span>/</span><sub>2</sub></span>", "<span class=\"fr\"><sup>1</sup><span>/</span><sub>3</sub></span>", "&minus;<span class=\"fr\"><sup>1</sup><span>/</span><sub>3</sub></span>", "<span class=\"fr\"><sup>2</sup><span>/</span><sub>3</sub></span>"], "a": "C"}, {"q": "How many distinct arrangements of the letters in LEVEL are there?", "c": ["20", "30", "24", "60", "120"], "a": "B"}, {"q": "A right triangle has side lengths 20, 21, and 29. What is the radius of its inscribed circle?", "c": ["6", "7", "8", "9", "5"], "a": "A"}, {"q": "If x + <span class=\"fr\"><sup>1</sup><span>/</span><sub>x</sub></span> = 5, what is x<sup>3</sup> + <span class=\"fr\"><sup>1</sup><span>/</span><sub>x<sup>3</sup></sub></span>?", "c": ["100", "110", "105", "125", "115"], "a": "B"}, {"q": "What is the smaller angle, in degrees, between the hour and minute hands of a clock at 3:40?", "c": ["120", "130", "125", "140", "135"], "a": "B"}, {"q": "Two fair six-sided dice are rolled. What is the probability that the sum is prime?", "c": ["<span class=\"fr\"><sup>1</sup><span>/</span><sub>2</sub></span>", "<span class=\"fr\"><sup>4</sup><span>/</span><sub>9</sub></span>", "<span class=\"fr\"><sup>1</sup><span>/</span><sub>3</sub></span>", "<span class=\"fr\"><sup>5</sup><span>/</span><sub>12</sub></span>", "<span class=\"fr\"><sup>7</sup><span>/</span><sub>12</sub></span>"], "a": "D"}, {"q": "What is the smallest positive integer n such that 360n is a perfect cube?", "c": ["45", "225", "15", "25", "75"], "a": "E"}, {"q": "In an arithmetic sequence the 3rd term is 11 and the 8th term is 31. What is the sum of the first 20 terms?", "c": ["840", "820", "800", "880", "760"], "a": "B"}, {"q": "Square ABCD has side length 6. E is the midpoint of BC and F is the midpoint of CD. What is the area of triangle AEF?", "c": ["15", "18", "13.5", "16", "12"], "a": "C"}, {"q": "How many positive divisors does 7200 have?", "c": ["36", "54", "45", "48", "60"], "a": "B"}, {"q": "What is the remainder when 3<sup>100</sup> is divided by 7?", "c": ["5", "3", "1", "2", "4"], "a": "E"}, {"q": "Two circles have radii 5 and 3, and their centers are 10 apart. What is the length of a common external tangent segment (between the two points of tangency)?", "c": ["2&radic;26", "10", "6", "4&radic;6", "8"], "a": "D"}, {"q": "How many ordered pairs of positive integers (x, y) satisfy <span class=\"fr\"><sup>1</sup><span>/</span><sub>x</sub></span> + <span class=\"fr\"><sup>1</sup><span>/</span><sub>y</sub></span> = <span class=\"fr\"><sup>1</sup><span>/</span><sub>6</sub></span>?", "c": ["10", "6", "8", "9", "12"], "a": "D"}, {"q": "Ten identical candies are shared among 4 children. Each child gets at least 1 candy and no child gets more than 4. In how many ways can this be done?", "c": ["56", "36", "44", "48", "40"], "a": "C"}, {"q": "A regular hexagon ABCDEF has side length 2. What is the area of triangle ACE?", "c": ["3&radic;3", "2&radic;3", "9", "4&radic;3", "6&radic;3"], "a": "A"}, {"q": "The roots of x<sup>3</sup> &minus; 7x<sup>2</sup> + kx &minus; 8 = 0 are real and form a geometric progression. What is k?", "c": ["15", "14", "16", "12", "13"], "a": "B"}, {"q": "How many positive integers from 1 to 1000 are neither perfect squares nor perfect cubes?", "c": ["964", "960", "962", "961", "963"], "a": "C"}, {"q": "How many nonempty subsets of {1, 2, 3, &hellip;, 10} contain no two consecutive integers?", "c": ["143", "233", "144", "89", "88"], "a": "A"}], "amc12": [{"q": "What is <span class=\"fr\"><sup>2<sup>10</sup> &minus; 2<sup>8</sup></sup><span>/</span><sub>2<sup>7</sup> + 2<sup>6</sup></sub></span>?", "c": ["2", "3", "8", "4", "6"], "a": "D"}, {"q": "A car drives 150 miles at 50 mph and returns the same 150 miles at 75 mph. What is its average speed for the round trip, in mph?", "c": ["65", "60", "64", "62.5", "70"], "a": "B"}, {"q": "What is log<sub>2</sub>8 + log<sub>3</sub><span class=\"fr\"><sup>1</sup><span>/</span><sub>9</sub></span> + log<sub>5</sub>&radic;5?", "c": ["1", "2", "3", "<span class=\"fr\"><sup>3</sup><span>/</span><sub>2</sub></span>", "<span class=\"fr\"><sup>5</sup><span>/</span><sub>2</sub></span>"], "a": "D"}, {"q": "Let i = &radic;&minus;1. What is i + i<sup>2</sup> + i<sup>3</sup> + &hellip; + i<sup>2026</sup>?", "c": ["0", "&minus;1", "1 + i", "i", "&minus;1 + i"], "a": "E"}, {"q": "How many integers x satisfy x<sup>2</sup> &lt; 5x + 24?", "c": ["9", "12", "13", "11", "10"], "a": "E"}, {"q": "A bag holds 4 red and 6 blue marbles. Three are drawn without replacement. What is the probability that exactly two are red?", "c": ["<span class=\"fr\"><sup>1</sup><span>/</span><sub>4</sub></span>", "<span class=\"fr\"><sup>3</sup><span>/</span><sub>10</sub></span>", "<span class=\"fr\"><sup>2</sup><span>/</span><sub>5</sub></span>", "<span class=\"fr\"><sup>1</sup><span>/</span><sub>5</sub></span>", "<span class=\"fr\"><sup>1</sup><span>/</span><sub>3</sub></span>"], "a": "B"}, {"q": "What is the sum of all solutions of |2x &minus; 3| = x + 6?", "c": ["9", "10", "6", "7", "8"], "a": "E"}, {"q": "An infinite geometric series has sum 12, and the series formed by squaring each of its terms has sum 48. What is the first term?", "c": ["4", "8", "9", "6", "3"], "a": "D"}, {"q": "Let f(x) = <span class=\"fr\"><sup>x + 2</sup><span>/</span><sub>x &minus; 1</sub></span>. What is f(f(f(3)))?", "c": ["2", "3", "1", "<span class=\"fr\"><sup>3</sup><span>/</span><sub>2</sub></span>", "<span class=\"fr\"><sup>5</sup><span>/</span><sub>2</sub></span>"], "a": "E"}, {"q": "A triangle has side lengths 13, 14, and 15. What is the radius of its circumscribed circle?", "c": ["<span class=\"fr\"><sup>17</sup><span>/</span><sub>2</sub></span>", "<span class=\"fr\"><sup>15</sup><span>/</span><sub>2</sub></span>", "8", "<span class=\"fr\"><sup>65</sup><span>/</span><sub>8</sub></span>", "7"], "a": "D"}, {"q": "How many points with integer coordinates lie on the circle x<sup>2</sup> + y<sup>2</sup> = 25?", "c": ["8", "12", "4", "16", "10"], "a": "B"}, {"q": "What is the sum of all positive divisors of 360?", "c": ["1170", "1260", "1080", "1200", "1110"], "a": "A"}, {"q": "What are the last two digits of 7<sup>2026</sup>?", "c": ["01", "07", "43", "49", "93"], "a": "D"}, {"q": "If log<sub>a</sub>b = 2 and log<sub>b</sub>c = 3, what is log<sub>ab</sub>c?", "c": ["<span class=\"fr\"><sup>3</sup><span>/</span><sub>2</sub></span>", "1", "3", "2", "6"], "a": "D"}, {"q": "Let z<sub>1</sub> and z<sub>2</sub> be the two complex numbers with |z| = |z &minus; 1| = 1. What is z<sub>1</sub><sup>2026</sup> + z<sub>2</sub><sup>2026</sup>?", "c": ["&minus;1", "&minus;2", "2", "1", "0"], "a": "A"}, {"q": "A sequence has a<sub>1</sub> = 1, a<sub>2</sub> = 3, and a<sub>n</sub> = a<sub>n&minus;1</sub> &minus; a<sub>n&minus;2</sub> for n &ge; 3. What is a<sub>1</sub> + a<sub>2</sub> + &hellip; + a<sub>2026</sub>?", "c": ["0", "1", "5", "6", "3"], "a": "C"}, {"q": "How many ordered triples (a, b, c) of positive integers satisfy abc = 72?", "c": ["54", "72", "60", "48", "36"], "a": "C"}, {"q": "If tan &theta; = 2, what is sin 2&theta; + cos 2&theta;?", "c": ["1", "&minus;<span class=\"fr\"><sup>1</sup><span>/</span><sub>5</sub></span>", "<span class=\"fr\"><sup>1</sup><span>/</span><sub>5</sub></span>", "<span class=\"fr\"><sup>3</sup><span>/</span><sub>5</sub></span>", "<span class=\"fr\"><sup>7</sup><span>/</span><sub>5</sub></span>"], "a": "C"}, {"q": "P(x) is a cubic polynomial with leading coefficient 1, and P(1) = 1, P(2) = 2, P(3) = 3. What is P(4)?", "c": ["10", "8", "4", "6", "12"], "a": "A"}, {"q": "A fair die is rolled three times. What is the expected number of distinct values that appear?", "c": ["<span class=\"fr\"><sup>11</sup><span>/</span><sub>4</sub></span>", "<span class=\"fr\"><sup>8</sup><span>/</span><sub>3</sub></span>", "3", "<span class=\"fr\"><sup>5</sup><span>/</span><sub>2</sub></span>", "<span class=\"fr\"><sup>91</sup><span>/</span><sub>36</sub></span>"], "a": "E"}, {"q": "What is the volume of a regular tetrahedron with edge length 6?", "c": ["18&radic;2", "24&radic;2", "27&radic;2", "12&radic;2", "36&radic;2"], "a": "A"}, {"q": "For how many integers n with 1 &le; n &le; 100 is n<sup>2</sup> + n + 1 divisible by 7?", "c": ["30", "28", "26", "27", "29"], "a": "E"}, {"q": "For how many positive integers n &le; 2026 does &lfloor;&radic;n&rfloor; divide n?", "c": ["135", "132", "133", "131", "129"], "a": "C"}, {"q": "A positive divisor of 10<sup>6</sup> is chosen at random. What is the probability that it is a perfect square?", "c": ["<span class=\"fr\"><sup>12</sup><span>/</span><sub>49</sub></span>", "<span class=\"fr\"><sup>9</sup><span>/</span><sub>49</sub></span>", "<span class=\"fr orking together at these rates, how many hours will it take them?", "c": ["4.5", "2.5", "2", "3", "1.5"], "a": "C"}, {"q": "The angles of a triangle are in the ratio 2 : 3 : 7. What is the largest angle, in degrees?", "c": ["100", "105", "110", "120", "90"], "a": "B"}, {"q": "How many three-digit positive integers have digits that add up to 5?", "c": ["12", "15", "21", "18", "20"], "a": "B"}, {"q": "A linear function f satisfies f(2) = 7 and f(5) = 16. What is f(10)?", "c": ["30", "31", "28", "34", "32"], "a": "B"}, {"q": "A fair coin is flipped 5 times. What is the probability of getting at least 4 heads?", "c": ["<span class=\"fr\"><sup>3</sup><span>/</span><sub>16</sub></span>", "<span class=\"fr\"><sup>1</sup><span>/</span><sub>8</sub></span>", "<span class=\"fr\"><sup>1</sup><span>/</span><sub>4</sub></span>", "<span class=\"fr\"><sup>5</sup><span>/</span><sub>16</sub></span>", "<span class=\"fr\"><sup>5</sup><span>/</span><sub>32</sub></span>"], "a": "A"}, {"q": "What is the units digit of 2<sup>2026</sup> + 3<sup>2026</sup>?", "c": ["7", "1", "9", "5", "3"], "a": "E"}, {"q": "How many diagonals does a convex 12-sided polygon have?", "c": ["66", "48", "54", "72", "60"], "a": "C"}, {"q": "An isosceles trapezoid has bases 10 and 22 and legs of length 10. What is its area?", "c": ["128", "144", "112", "136", "120"], "a": "A"}, {"q": "Two positive integers have greatest common divisor 6 and least common multiple 180. What is the smallest possible value of their sum?", "c": ["66", "126", "186", "102", "78"], "a": "A"}, {"q": "What is the sum of all integers n for which <span class=\"fr\"><sup>n + 10</sup><span>/</span><sub>n &minus; 2</sub></span> is an integer?", "c": ["0", "12", "24", "48", "36"], "a": "C"}, {"q": "A circle is tangent to both the positive x-axis and the positive y-axis and passes through the point (2, 1). What is the sum of all possible radii?", "c": ["4", "5", "7", "8", "6"], "a": "E"}, {"q": "Two different numbers are drawn at random from {1, 2 const L="ABCDE";let cur="amc10";let day=dayKeys[dayKeys.length-1];let T,state;
